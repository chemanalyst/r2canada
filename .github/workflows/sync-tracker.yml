name: Sync Reservation Tracker

# Runs automatically once a day, and can also be triggered manually from
# the Actions tab (Run workflow button) whenever you want to check sooner.
on:
  schedule:
    - cron: '0 13 * * *'  # 13:00 UTC daily (~9am Eastern)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync new form responses
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: node js/sync-tracker.mjs

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Sync new reservation tracker entries'
          title: 'New reservation tracker entries to review'
          body: |
            Automated sync found new Google Form responses since the last run.

            Review the entries added to `js/tracker-data.js` below, edit anything
            that looks off (e.g. inconsistent order-status wording), then merge
            to publish them on the live site.
          branch: sync/tracker-data
          add-paths: |
            js/tracker-data.js
            js/tracker-sync-state.json
